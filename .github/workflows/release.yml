name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build portable exe
        run: python -m PyInstaller PushAnything.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile inno.exe
          Start-Process -FilePath .\inno.exe -ArgumentList '/VERYSILENT','/CURRENTUSER','/NORESTART' -Wait

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          & $iscc installer\installer.iss

      - name: Package writing template
        shell: pwsh
        run: |
          $version = (Select-String -Path installer/installer.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path docs/templates/wild/* -DestinationPath "dist/PushAnything-Wild-Template-$version.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pushanything
          path: |
            dist/*.exe
            dist/*.zip
            installer/*.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v1.3.0.md
          files: |
            dist/PushAnything.exe
            dist/PushAnything-Wild-Template-*.zip
            installer/PushAnything_Setup_*.exe
